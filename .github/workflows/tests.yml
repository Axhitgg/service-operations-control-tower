name: Service Operations Control Tower CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          OPENAI_API_KEY: test-key
          SERVICE_API_KEY: control-tower-demo-key-2026
        run: python -m pytest -q test_service_api.py

      - name: Build Docker image
        run: docker build -t service-operations-control-tower .
